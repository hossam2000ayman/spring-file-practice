spring.application.name=files-practice
# This must be outside of jar
file-storage.base-path=../app/files/uploads

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

minio.server.url=http://localhost:9000
minio.server.username=user
minio.server.password=password
minio.bucket-name=default-bucket